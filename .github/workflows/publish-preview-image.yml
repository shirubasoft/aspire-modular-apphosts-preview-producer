name: Publish preview API image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/preview-resource-change

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_REPOSITORY: ghcr.io/shirubasoft/aspire-modular-apphosts-preview-producer/api

    steps:
      - name: Check out producer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable preview image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/PreviewProducer.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record immutable image identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build did not return a valid SHA-256 image digest." >&2
            exit 1
          fi

          mkdir -p artifacts
          jq -n \
            --arg resource "preview-producer-api" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg digest "$IMAGE_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            '{resource: $resource, repository: $repository, digest: $digest, commit: $commit}' \
            > artifacts/preview-producer-api-image.json

          echo "### Preview image" >> "$GITHUB_STEP_SUMMARY"
          printf '`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Make the sample image publicly pullable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/aspire-modular-apphosts-preview-producer%2Fapi" \
            --field visibility=public \
            > /dev/null

      - name: Upload image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-producer-api-${{ github.sha }}
          path: artifacts/preview-producer-api-image.json
          if-no-files-found: error
          retention-days: 7
